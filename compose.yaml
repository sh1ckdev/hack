services:
  app:
    build:
      context: .
      args:
        VITE_ITSM_INCIDENT_URL: ${VITE_ITSM_INCIDENT_URL:-}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:8080"
    environment:
      INCIDENTS_FILE: /app/data/character_problems.json
      INCIDENTS_EDITOR_KEY: ${INCIDENTS_EDITOR_KEY:-}
      INCIDENT_AI_MODE: ${INCIDENT_AI_MODE:-template}
      INCIDENT_AI_URL: ${INCIDENT_AI_URL:-}
      INCIDENT_AI_MODEL: ${INCIDENT_AI_MODEL:-}
      INCIDENT_AI_KEY: ${INCIDENT_AI_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-}
      INCIDENTS_VOICE_MODEL_URL: ${INCIDENTS_VOICE_MODEL_URL:-http://host.docker.internal:8180/v1/chat/completions}
      INCIDENTS_WHISPER_URL: ${INCIDENTS_WHISPER_URL:-http://host.docker.internal:8178/inference}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - incident-data:/app/data
      - shift-state:/app/.local
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

volumes:
  incident-data:
  shift-state:
